<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>राष्ट्रबोध</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans Devanagari",sans-serif;
 background:#f6f3ed;
 color:#18202c
}
header{
 background:white;
 border-bottom:1px solid #ddd;
 padding:15px
}
.nav{
 max-width:1050px;
 margin:auto;
 display:flex;
 align-items:center;
 gap:15px
}
.logo{
 font-size:28px;
 font-weight:bold;
 color:#8d2020
}
.spacer{flex:1}
button{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 font-weight:bold;
 cursor:pointer
}
.red{background:#8d2020;color:white}
.gray{background:#eee}
main{
 max-width:1050px;
 margin:auto;
 padding:25px 18px
}
.hero{
 background:white;
 padding:35px;
 border-radius:16px;
 border:1px solid #ddd;
 margin-bottom:25px
}
.hero h1{
 font-size:45px;
 margin:0 0 10px
}
.muted{color:#666;line-height:1.7}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
 gap:18px
}
.card{
 background:white;
 border:1px solid #ddd;
 border-radius:14px;
 padding:20px
}
input,select,textarea{
 width:100%;
 padding:12px;
 margin:7px 0 15px;
 border:1px solid #ccc;
 border-radius:8px;
 font:inherit
}
textarea{
 min-height:250px;
 line-height:1.8
}
.hidden{display:none}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px
}
.box{
 background:white;
 width:min(700px,100%);
 padding:25px;
 border-radius:15px;
 max-height:90vh;
 overflow:auto
}
.close{
 float:right;
 background:none;
 font-size:25px
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">राष्ट्रबोध</div>
<div class="spacer"></div>

<span id="user"></span>

<button id="login" class="red">
Google Login
</button>

<button id="write" class="gray hidden">
लेख लिखें
</button>

<button id="logout" class="gray hidden">
Logout
</button>

</div>
</header>

<main>

<section class="hero">

<h1>राष्ट्रबोध</h1>

<p class="muted">
इतिहास, राजनीति, भू-राजनीति, विज्ञान और समसामयिक विषयों पर गंभीर लेखन का डिजिटल मंच।
</p>

<button id="heroWrite" class="red">
अपना लेख लिखें
</button>

</section>

<input id="search" placeholder="लेख खोजें...">

<br><br>

<section id="posts" class="grid">
<div class="card">
लेख लोड हो रहे हैं...
</div>
</section>

</main>

<footer style="text-align:center;padding:35px;color:#777">
© 2026 राष्ट्रबोध
</footer>


<!-- LOGIN -->

<div id="loginBox" class="modal hidden">

<div class="box">

<button class="close" onclick="closeBox('loginBox')">
×
</button>

<h2>राष्ट्रबोध में प्रवेश</h2>

<p>
लेख लिखने के लिए Google account से login करें।
</p>

<button id="googleLogin" class="red">
Google से जारी रखें
</button>

</div>

</div>


<!-- ARTICLE -->

<div id="articleBox" class="modal hidden">

<div class="box">

<button class="close" onclick="closeBox('articleBox')">
×
</button>

<h2>नया लेख</h2>

<label>शीर्षक</label>

<input id="title" placeholder="लेख का शीर्षक">


<label>विषय</label>

<select id="category">

<option>राजनीति</option>
<option>इतिहास</option>
<option>भू-राजनीति</option>
<option>विज्ञान</option>
<option>समसामयिक</option>
<option>अन्य</option>

</select>


<label>लेखक</label>

<input id="author" placeholder="आपका नाम">


<label>लेख</label>

<textarea id="body"
placeholder="अपना लेख यहाँ लिखें..."></textarea>


<button id="publish" class="red">
Publish Article
</button>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyB1YvXfVbYbyOT1WYQtvjtis94PqggvK3M",

authDomain:"rastrabodh-51001.firebaseapp.com",

projectId:"rastrabodh-51001",

storageBucket:"rastrabodh-51001.firebasestorage.app",

messagingSenderId:"362694903493",

appId:"1:362694903493:web:2c21ff7792cbab80f992ac",

measurementId:"G-L40ZF2CDD7"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const provider=new GoogleAuthProvider();

let currentUser=null;

let articles=[];


const $=id=>document.getElementById(id);


function login(){

signInWithPopup(auth,provider)

.catch(error=>{

alert("Login नहीं हो पाया: "+error.message);

});

}


$("login").onclick=login;

$("googleLogin").onclick=login;


$("logout").onclick=()=>signOut(auth);


function writeArticle(){

if(currentUser){

$("articleBox").classList.remove("hidden");

}else{

$("loginBox").classList.remove("hidden");

}

}


$("write").onclick=writeArticle;

$("heroWrite").onclick=writeArticle;


window.closeBox=function(id){

$(id).classList.add("hidden");

};


onAuthStateChanged(auth,user=>{

currentUser=user;

$("login").classList.toggle("hidden",!!user);

$("write").classList.toggle("hidden",!user);

$("logout").classList.toggle("hidden",!user);

$("user").textContent=user?
(user.displayName||user.email):"";

});


onSnapshot(

query(
collection(db,"articles"),
orderBy("createdAt","desc")
),

snapshot=>{

articles=snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));

render();

},

error=>{

$("posts").innerHTML=
"<div class='card'>Firestore error: "
+error.message+
"</div>";

}

);


function render(){

let search=$("search").value.toLowerCase();

let list=articles.filter(article=>

(article.title||"")
.toLowerCase()
.includes(search)

);


if(list.length===0){

$("posts").innerHTML=
"<div class='card'>अभी कोई लेख प्रकाशित नहीं हुआ है।</div>";

return;

}


$("posts").innerHTML=list.map(article=>`

<div class="card">

<div class="muted">
${article.category||"अन्य"}
•
${article.author||"राष्ट्रबोध"}
</div>

<h2>${escapeHtml(article.title)}</h2>

<p class="muted">
${escapeHtml((article.body||"").substring(0,220))}
...
</p>

<button class="gray"
onclick="readArticle('${article.id}')">

पूरा पढ़ें

</button>

</div>

`).join("");

}


window.readArticle=function(id){

let a=articles.find(x=>x.id===id);

if(!a)return;

$("articleBox").classList.remove("hidden");

$("articleBox").querySelector(".box").innerHTML=`

<button class="close"
onclick="closeBox('articleBox')">
×
</button>

<div class="muted">
${escapeHtml(a.category||"")}
•
${escapeHtml(a.author||"")}
</div>

<h1>
${escapeHtml(a.title||"")}
</h1>

<p style="white-space:pre-wrap;line-height:1.9;font-size:18px">

${escapeHtml(a.body||"")}

</p>

`;

};


$("search").oninput=render;


$("publish").onclick=async()=>{

if(!currentUser)return;

let title=$("title").value.trim();

let body=$("body").value.trim();

let author=$("author").value.trim()
||currentUser.displayName
||"राष्ट्रबोध";


if(!title||!body){

alert("शीर्षक और लेख भरें।");

return;

}


$("publish").disabled=true;


try{

await addDoc(
collection(db,"articles"),
{

title:title,

body:body,

category:$("category").value,

author:author,

uid:currentUser.uid,

createdAt:serverTimestamp()

});


$("title").value="";

$("body").value="";

$("author").value="";

$("articleBox").classList.add("hidden");

alert("लेख सफलतापूर्वक प्रकाशित हो गया।");


}catch(error){

alert("Publish error: "+error.message);

}


$("publish").disabled=false;

};


function escapeHtml(text){

return String(text||"")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}

</script>

</body>
</html>
